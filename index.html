<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Zines - FEOB</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        h1 { text-align: center; color: #2c3e50; }
        
        #galeria {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 40px auto;
        }

        .zine-card {
            background: white;
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.2s;
            text-align: center;
        }

        .zine-card:hover { transform: translateY(-5px); }

        canvas {
            width: 100%;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .titulo {
            font-size: 14px;
            font-weight: bold;
            text-transform: capitalize;
        }

        /* MODAL */
        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #container-pdf {
            width: 90%;
            height: 90%;
            background: #fff;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .fechar {
            position: absolute;
            top: -35px;
            right: 0;
            color: white;
            font-size: 20px;
            cursor: pointer;
            font-weight: bold;
            background: none;
            border: none;
        }
    </style>
</head>
<body>

    <h1>Coleção de Zines</h1>
    <div id="galeria">Carregando...</div>

    <div id="modal">
        <div id="container-pdf">
            <button class="fechar" onclick="fechar()">FECHAR ✕</button>
            <iframe id="iframe-pdf" src=""></iframe>
        </div>
    </div>

    <script>
        // --- CONFIGURAÇÃO ---
        const usuario = 'progrmacaofake563-design';
        const repositorio = 'zine-feob';
        const pasta = 'zines';
        
        // URL Base do GitHub Pages (O segredo para funcionar!)
        const urlBaseSite = `https://${usuario}.github.io/${repositorio}/${pasta}/`;

        const galeria = document.getElementById('galeria');
        const modal = document.getElementById('modal');
        const iframe = document.getElementById('iframe-pdf');

        async function init() {
            try {
                // 1. Pega a lista de arquivos via API
                const resp = await fetch(`https://api.github.com/repos/${usuario}/${repositorio}/contents/${pasta}?ref=main`);
                const arquivos = await resp.json();
                
                galeria.innerHTML = ''; 

                const pdfs = arquivos.filter(a => a.name.toLowerCase().endsWith('.pdf'));

                if (pdfs.length === 0) {
                    galeria.innerHTML = '<p>Nenhum PDF encontrado.</p>';
                    return;
                }

                // 2. Cria os cartões
                pdfs.forEach(pdf => {
                    // Aqui está a correção: Montamos o link do SITE, não do código
                    const linkDoSite = urlBaseSite + pdf.name;
                    criarCartao(pdf.name, linkDoSite);
                });

            } catch (e) {
                console.error(e);
                galeria.innerHTML = '<p>Erro ao carregar lista.</p>';
            }
        }

        async function criarCartao(nome, urlPdf) {
            const card = document.createElement('div');
            card.className = 'zine-card';
            card.onclick = () => abrir(urlPdf);

            const canvas = document.createElement('canvas');
            const titulo = document.createElement('div');
            titulo.className = 'titulo';
            titulo.innerText = nome.replace('.pdf', '').replace(/_/g, ' ');

            card.appendChild(canvas);
            card.appendChild(titulo);
            galeria.appendChild(card);

            // Gera a Capa
            try {
                const pdf = await pdfjsLib.getDocument(urlPdf).promise;
                const page = await pdf.getPage(1);
                const viewport = page.getViewport({ scale: 0.5 });
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
            } catch (err) {
                console.log("Erro na capa:", err);
            }
        }

        function abrir(url) {
            iframe.src = url;
            modal.style.display = 'flex';
        }

        function fechar() {
            modal.style.display = 'none';
            iframe.src = '';
        }

        init();
    </script>
</body>
</html>
